# Kontrola na každý push a pull request.
#
# Databázi workflow nepotřebuje: integrační testy běží proti PGlite (Postgres
# ve WASM) a produkční build je záměrně postavený tak, aby se obešel bez
# dostupné databáze. Runner tedy nemusí spouštět žádnou službu.
name: Kontrola

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # Nový push do stejné větve ruší předchozí běh; stará odpověď nikoho nezajímá.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kontrola:
    name: Formát, lint, typy, testy, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalace závislostí
        run: npm ci

      - name: Formát, lint, typy a testy
        run: npm run check

      - name: Produkční build
        # Hodnota je smyšlená schválně: build k databázi nesmí sahat.
        # Kdyby na ni sáhl, spadne to tady, a ne až při nasazení.
        env:
          DATABASE_URL: postgres://build:build@127.0.0.1:5432/build
        run: npm run build

  e2e:
    name: Průchod aplikací
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalace závislostí
        run: npm ci

      - name: Instalace prohlížeče
        run: npx playwright install --with-deps chromium

      - name: E2E testy
        run: npm run test:e2e

      - name: Záznam z neúspěšného běhu
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
