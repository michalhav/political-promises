# Kontrola na každý push a pull request.
#
# Databázi workflow nepotřebuje: integrační testy běží proti PGlite (Postgres
# ve WASM) a produkční build se obejde nejen bez dostupné databáze, ale i bez
# proměnné, která by na ni ukazovala. Runner tedy nemusí spouštět žádnou službu.
name: Kontrola

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # Nový push do stejné větve ruší předchozí běh; stará odpověď nikoho nezajímá.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kontrola:
    name: Formát, lint, typy, testy, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalace závislostí
        run: npm ci

      - name: Formát, lint, typy a testy
        run: npm run check

      - name: Produkční build
        # Schválně **bez jediné proměnné prostředí**. Build k databázi sahat
        # nesmí a tenhle krok je to jediné, co to vynutí: dokud se sem
        # podstrkovala smyšlená DATABASE_URL, chyba se schovala úplně stejně
        # jako za .env na vývojářském stroji a projevila by se až v nasazení.
        run: npm run build

  e2e:
    name: Průchod aplikací
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalace závislostí
        run: npm ci

      - name: Instalace prohlížeče
        run: npx playwright install --with-deps chromium

      - name: E2E testy
        run: npm run test:e2e

      - name: Záznam z neúspěšného běhu
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
