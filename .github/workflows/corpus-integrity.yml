# Týdenní ověření, že se zdrojové dokumenty na webu nezměnily.
#
# Když politický subjekt svůj program tiše vymění, nejsou to naše chyba ani
# chyba nástroje — je to **nález o dokumentu**. Všechny anotace a citace se
# vážou k otisku zmrazené verze, takže změna znamená, že je potřeba rozhodnout,
# co dál. Proto to končí založeným issue, ne tichým přepsáním otisku.
name: Kontrola otisků korpusu

on:
  schedule:
    # Pondělí ráno; nikdo to nemá spěchat kontrolovat o víkendu.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  otisky:
    name: Ověřit otisky proti provenienci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      issues: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Stáhnout a ověřit
        id: fetch
        run: |
          selhalo=""
          for adresar in corpus/*/; do
            [ -f "$adresar/provenance.json" ] || continue
            echo "::group::$adresar"
            if ! npm run --silent corpus:fetch -- "$adresar"; then
              selhalo="$selhalo $adresar"
            fi
            echo "::endgroup::"
          done
          if [ -n "$selhalo" ]; then
            echo "zmenene=$selhalo" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Založit issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const bezi = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "Otisk zdrojového dokumentu v korpusu nesouhlasí",
              labels: ["korpus"],
              body: [
                "Týdenní kontrola zjistila, že zdrojový dokument na webu se liší od zmrazené verze.",
                "",
                `Podrobnosti: ${bezi}`,
                "",
                "**Otisk v `provenance.json` nepřepisuj.** Anotace a citace se vážou k původnímu",
                "textu; tichá výměna by je znehodnotila.",
                "",
                "Co s tím:",
                "1. Původní verzi nech být — je zmrazená u anotací.",
                "2. Novou verzi ulož jako samostatný adresář s vlastní proveniencí.",
                "3. Anotace k nové verzi ověř znovu, posuny nemusí sedět.",
              ].join("\n"),
            });
